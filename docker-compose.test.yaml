services:
  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./packages/server:/app
      - test_node_modules:/app/node_modules
      - test_data:/data
    environment:
      - NODE_ENV=test
      - DATABASE_PATH=/data/token-service.db
      - PORT=3000
      - GITHUB_APP_ID=test-app-id
      - GITHUB_APP_PRIVATE_KEY=test-private-key
      - GITHUB_INSTALLATION_ID=test-installation-id
      - RP_ID=localhost
      - RP_NAME=GitHub Token Service (Test)
      - ORIGIN=http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: sh -c "npm run db:migrate && npm run dev"

  runner:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    volumes:
      - ./packages/server:/app
      - test_node_modules:/app/node_modules
    environment:
      - NODE_ENV=test
      - API_URL=http://server:3000
    depends_on:
      server:
        condition: service_healthy
    command: npm test

volumes:
  test_node_modules:
  test_data:
